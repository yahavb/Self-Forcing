# Idle pod that mounts the artifact PVC at /var/mdl, so finished runs' mp4s can be
# copied out with `kubectl cp` (a completed Job's pod has no running container to
# copy from). No resource claim: this touches no NeuronCores.
#
#   kubectl apply -f pvc-shell.yaml
#   kubectl wait --for=condition=Ready pod/pvc-shell --timeout=120s
#   kubectl exec pvc-shell -- ls -lt /var/mdl/self_forcing/runs/
#   kubectl cp pvc-shell:/var/mdl/self_forcing/runs/<TIMESTAMP>/prompt_000.mp4 ./prompt_000.mp4
#   kubectl delete pod pvc-shell
apiVersion: v1
kind: Pod
metadata:
  name: pvc-shell
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    node-type: trn3-dev1
  containers:
    - name: shell
      # Same image the job uses: already cached on the node, so no new pull.
      image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c", "sleep 86400"]
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          cpu: 1
          memory: 2Gi
      volumeMounts:
        - name: 621547421844-ap-southeast-4-pvc
          mountPath: /var/mdl
  volumes:
    - name: 621547421844-ap-southeast-4-pvc
      persistentVolumeClaim:
        claimName: 621547421844-ap-southeast-4-pvc
